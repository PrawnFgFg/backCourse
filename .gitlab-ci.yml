stages:         
  - build
  - lint_format
  - migrations
  - test
  - deploy

build-job:       
  stage: build
  before_script:
    - cp ${ENV} .env
    - cp ${TEST_ENV} .env-test
  script:
    - docker build -t booking-api-image . 


Lint:
  stage: lint_format
  script:
    - docker run --rm --network MyNetwork booking-api-image ruff check



Format:
  stage: lint_format
  script:
    - docker run --rm --network MyNetwork booking-api-image ruff format --check


Migrations:
  stage: migrations
  script:
    - docker run --rm --network MyNetwork booking-api-image alembic upgrage head


Tetst:
  stage: test
  script:
    - docker run --rm --network MyNetwork booking-api-image pytest -s -v




deploy-job:      
  stage: deploy  
  environment: production
  script:
    - docker compose -f docker-compose-ci.yml up -d
    - docker exec booking_nginx nginx -s reload 
